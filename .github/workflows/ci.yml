name: Validate AFARA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Prepare isolated development services
        run: |
          docker compose up -d --wait
          docker compose exec -T db createdb -U postgres afara_ci_acceptance
          node --input-type=module <<'JS'
          import fs from 'node:fs'; import crypto from 'node:crypto';
          const values = ['DATABASE_URL=postgresql://postgres@127.0.0.1:5432/afara_ci_acceptance', 'PAYLOAD_SECRET='+crypto.randomBytes(32).toString('hex'), 'APP_URL=http://localhost:3000', 'AFARA_STAGE=development', 'AFARA_DB_PUSH=false', 'MEDIA_DIR=./media', 'SMTP_HOST=127.0.0.1', 'SMTP_PORT=1025', 'SMTP_FROM=afara@example.test', ''];
          fs.writeFileSync('.env.local', values.join('\n'), {mode:0o600});
          JS
          AFARA_STAGE=build npm run db:migrate
          npm run seed:dev
          npx tsx --env-file-if-exists=.env.local tests/bootstrap.ts
      - name: Validate material study in a separate acceptance database
        run: |
          docker compose exec -T db createdb -U postgres -T afara_ci_acceptance afara_material_study_acceptance
          DATABASE_URL=postgresql://postgres@127.0.0.1:5432/afara_material_study_acceptance \
          MEDIA_DIR=/tmp/afara-material-study-media \
          AFARA_STAGE=development AFARA_DB_PUSH=false \
          AFARA_CONTENT_BACKUP_DIR=/tmp/afara-material-study-backups \
          node --import tsx --env-file-if-exists=.env.local tests/material-study.cms.acceptance.ts
      - run: npm run typecheck && npm run lint && npm run build
      - name: Start and validate
        run: |
          npm run start > /tmp/afara.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          npm test
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: afara-screenshots
          path: docs/screenshots
